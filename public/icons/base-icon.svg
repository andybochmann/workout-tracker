<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="512" height="512" rx="80" fill="#0f172a"/>
  
  <!-- Dumbbell -->
  <g transform="translate(80, 256)">
    <!-- Left weight -->
    <rect x="0" y="-60" width="30" height="120" rx="5" fill="#ffffff"/>
    <rect x="30" y="-40" width="20" height="80" rx="2" fill="#ffffff"/>
    
    <!-- Bar -->
    <rect x="50" y="-15" width="240" height="30" rx="5" fill="#ffffff"/>
    
    <!-- Right weight -->
    <rect x="290" y="-40" width="20" height="80" rx="2" fill="#ffffff"/>
    <rect x="310" y="-60" width="30" height="120" rx="5" fill="#ffffff"/>
  </g>
  
  <!-- Stats graph line (simplified) -->
  <polyline points="120,350 180,330 240,280 300,310 360,270" stroke="#4ade80" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
